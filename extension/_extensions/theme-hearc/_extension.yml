title: Thème HE-Arc Ingénierie (Beamer et reveal.js)
author: Fabrizio Albertetti
version: 1.1.0
quarto-required: ">=1.4.0"
contributes:
  # Ajouté automatiquement au projet qui installe l'extension :
  # renomme « cours+handout.pdf » en « cours-handout.pdf » après le rendu
  metadata:
    project:
      post-render:
        - handout-rename.lua
  formats:
    # Réglages partagés par tous les formats ci-dessous
    common:
      slide-level: 2
      lang: fr
      highlight-style: github
      fig-align: center
      filters:
        - course-meta.lua

    # theme-hearc-beamer : présentation PDF avec animations (pauses, listes progressives)
    beamer:
      pdf-engine: xelatex
      theme: hearc-ing
      aspectratio: 169
      logo: logo-he-arc-ing.jpg
      logooptions:
        - height=0.9cm
      format-resources:
        - beamerthemehearc-ing.sty
        - logo-he-arc-ing.jpg
    # theme-hearc-beamer+handout : support à distribuer, une page par frame
    # montrant l'état final de ses animations (l'option `handout` de Beamer
    # superposerait toutes les étapes, voir handout-last-slide.tex).
    # Ne pas factoriser avec `beamer` : la variante n'hérite pas de ses
    # réglages, et une ancre YAML (<<: *beamer) perd les format-resources.
    beamer+handout:
      pdf-engine: xelatex
      theme: hearc-ing
      aspectratio: 169
      logo: logo-he-arc-ing.jpg
      logooptions:
        - height=0.9cm
      format-resources:
        - beamerthemehearc-ing.sty
        - logo-he-arc-ing.jpg
      include-in-header:
        - handout-last-slide.tex

    # theme-hearc-revealjs : présentation HTML (navigateur), même charte
    revealjs:
      theme: hearc-ing.scss
      template-partials:
        - title-slide.html
      # 16:9, comme aspectratio: 169 en Beamer
      width: 1280
      height: 720
      center: false
      slide-number: c/t
      show-slide-number: all
      transition: none
      # Image sans extension (`![](images/schema)`) : .svg ici, .pdf en Beamer
      default-image-extension: svg
      format-resources:
        - logo-he-arc-ing.jpg
