<section id="$idprefix$title-slide"$for(title-slide-attributes/pairs)$ $it.key$="$it.value$"$endfor$ class="quarto-title-block hearc-title">
  <div class="hearc-bar"></div>
  <h1 class="title">$title$</h1>
$if(subtitle)$
  <p class="subtitle">$subtitle$</p>
$endif$
  <div class="hearc-meta">
$for(by-author)$
    <p class="author">$by-author.name.literal$</p>
$endfor$
$for(institute)$
    <p class="institute">$institute$</p>
$endfor$
$if(hearc-courseline)$
    <p class="course">$hearc-courseline$</p>
$endif$
$if(date)$
    <p class="date">$date$</p>
$endif$
  </div>
  <img class="hearc-logo" src="logo-he-arc-ing.jpg" alt="HE-Arc Ingénierie">
</section>
