project:
  type: default
  output-dir: _output

# ---------------------------------------------------------------------------
# Paramètres communs à toutes les présentations du cours
# (à adapter une fois par cours ; titre et sous-titre sont dans chaque .qmd)
# ---------------------------------------------------------------------------
course:
  name: "Intelligence Artificielle"
  short: "IA"          # affiché dans le pied de page (optionnel, défaut : name)
  class: "ISC3"       # classe / volée
  footer: ""          # texte libre à gauche du pied de page (optionnel)

author: "Fabrizio Albertetti"
institute: "HE-Arc Ingénierie"
date: today
date-format: "D MMMM YYYY"

# Chaque présentation produit trois fichiers dans _output/ :
#   01-exemple.pdf          avec animations (pour projeter)
#   01-exemple-handout.pdf  sans animations, une page par diapositive (à distribuer)
#   01-exemple.html         reveal.js, à ouvrir dans un navigateur (touche S : notes)
# Supprimer une ligne ci-dessous pour ne plus produire le format correspondant.
format:
  theme-hearc-beamer:
    # Thème Beamer : `hearc-ing` (charte du logo) ou tout thème standard
    # (Madrid, Boadilla, metropolis, ...). Le nom du cours et la classe
    # ne sont affichés que par le thème `hearc-ing`.
    theme: hearc-ing
    # colortheme: beaver
  # Mêmes options que ci-dessus (à reporter si on change de thème)
  theme-hearc-beamer+handout: default
  # Thème reveal.js : `hearc-ing.scss` (défaut) ou un thème standard
  # (simple, serif, ...) ; voir https://quarto.org/docs/presentations/revealjs/
  theme-hearc-revealjs: default
