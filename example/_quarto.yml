project:
  type: default
  output-dir: _output

# ---------------------------------------------------------------------------
# Paramètres communs à toutes les présentations du cours
# (à adapter une fois par cours ; titre et sous-titre sont dans chaque .qmd)
# ---------------------------------------------------------------------------
course:
  name: "Intelligence Artificielle"
  short: "IA"          # affiché dans le pied de page (optionnel, défaut : name)
  class: "ISC3"       # classe / volée
  footer: ""          # texte libre à gauche du pied de page (optionnel)

author: "Fabrizio Albertetti"
institute: "HE-Arc Ingénierie"
date: today
date-format: "D MMMM YYYY"

# Chaque présentation produit deux fichiers dans _output/ :
#   01-exemple.html  à projeter depuis un navigateur (touche S : notes de l'orateur,
#                    F : plein écran)
#   01-exemple.pdf   à distribuer : une page par diapositive, état final des
#                    animations, sans les notes (exporté par `quarto render` ;
#                    pas par `quarto preview 01-exemple.qmd`, voir README)
format:
  # Options reveal.js : https://quarto.org/docs/presentations/revealjs/
  # (par ex. `incremental: true` pour rendre toutes les listes progressives)
  theme-hearc-revealjs: default
